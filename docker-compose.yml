version: '3.8'

services:
  app:
    build: .
    container_name: pastel24h_app
    ports:
      - "5000:5000"
    volumes:
      # Dados do banco SQLite persistidos no host
      - ./data:/app/data
    env_file:
      # Carrega as variáveis de ambiente do seu arquivo .env
      - ./.env
    restart: unless-stopped