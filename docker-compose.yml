services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_ENV: production
    container_name: pastel24h_app
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      - ./data:/app/data
      - app_logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=5000
    env_file:
      - .env
    networks:
      - pastel24h-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    container_name: pastel24h_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - EMAIL=${EMAIL}
    networks:
      - pastel24h-network
    depends_on:
      app:
        condition: service_healthy

volumes:
  app_logs:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

networks:
  pastel24h-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
