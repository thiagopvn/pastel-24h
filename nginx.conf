server {
    listen 80;
    server_name _; # IMPORTANTE: SUBSTITUA PELO SEU DOMÍNIO OU IP DA VPS

    # Configuração de proxy para a aplicação principal
    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Configuração para WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400; # Mantém conexão WebSocket ativa
        proxy_cache_bypass $http_upgrade;
    }

    # Configuração específica para o endpoint WebSocket
    location /ws-api {
        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Configuração de logs para debug (opcional)
    access_log /var/log/nginx/pastel24h.access.log;
    error_log /var/log/nginx/pastel24h.error.log;

    # Configuração de timeout para evitar problemas
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
}